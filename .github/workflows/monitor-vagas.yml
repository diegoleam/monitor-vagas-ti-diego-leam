
name: Monitor Vagas TI - Producao

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execucao"
        required: true
        type: choice
        default: "teste"
        options:
          - teste
          - producao

permissions:
  contents: write

concurrency:
  group: monitor-vagas-producao
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Recuperar historico persistente
        id: recuperar_historico
        shell: bash
        run: |
          set -e
          git fetch origin estado-monitor
          mkdir -p dados

          git show origin/estado-monitor:dados/vagas.json > dados/vagas.json
          git show origin/estado-monitor:dados/historico.json > dados/historico.json

          python -m json.tool dados/vagas.json > /dev/null
          python -m json.tool dados/historico.json > /dev/null

          echo "Historico recuperado e validado."


      - name: Testar monitor sem enviar mensagens
        if: ${{ inputs.modo == 'teste' }}
        run: python main.py --portal todos --simular

      - name: Executar monitor em producao
        if: ${{ inputs.modo == 'producao' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_TESTE: ${{ secrets.TELEGRAM_CHAT_TESTE }}
        run: python main.py --portal todos --enviar --limite 5



      - name: Salvar historico atualizado
        if: ${{ always() && inputs.modo == 'producao' && steps.recuperar_historico.outcome == 'success' }}
        shell: bash
        run: |
          set -e

          if [ ! -f dados/vagas.json ] || [ ! -f dados/historico.json ]; then
            echo "Arquivos de historico ausentes."
            exit 1
          fi

          python -m json.tool dados/vagas.json > /dev/null
          python -m json.tool dados/historico.json > /dev/null

          cp dados/vagas.json /tmp/monitor-vagas.json
          cp dados/historico.json /tmp/monitor-historico.json

          git fetch origin estado-monitor
          git checkout -B estado-monitor origin/estado-monitor

          cp /tmp/monitor-vagas.json dados/vagas.json
          cp /tmp/monitor-historico.json dados/historico.json

          git add -f dados/vagas.json dados/historico.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no historico."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Atualizar historico de vagas"
          git push origin estado-monitor

          echo "Historico atualizado com sucesso."
