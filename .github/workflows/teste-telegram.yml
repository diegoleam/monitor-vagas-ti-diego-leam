name: Teste Telegram (somente chat pessoal)
on:
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m testes.testar_telegram --enviar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_TESTE: ${{ secrets.TELEGRAM_CHAT_TESTE }}
